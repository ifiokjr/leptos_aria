# monostyle's configuration for this repository.
#
# The ignore list names what a reader is not meant to read: generated output
# and vendored upstream sources. Everything authored and readable is measured
# with the default rules.

[rules]
max-line-width = 100
tab-width = 4

[rules.ignore]
patterns = [
	"CHANGELOG.md",
	"**/CHANGELOG.md",
	"**/changelog.md",
]

# Test files assert on concrete calendar dates and month lengths, which read
# as magic numbers out of context; the language fixture suites in the
# reference repository get the same relief.
[[section]]
path = "crates/leptos_aria_date/tests"

reason = "tests assert on concrete calendar dates and month lengths, which read as magic numbers out of context"
rules.report-magic-numbers = false
max-nesting-depth = 8
max-parameters-inline = 8
max-unit-lines = 200
fail-under = { readability = 60.0, complexity = 60.0 }

[[section]]
path = "crates/leptos_aria_date_picker/tests"

reason = "range tests assert on concrete calendar dates, which read as magic numbers out of context"
rules.report-magic-numbers = false
max-nesting-depth = 8
max-parameters-inline = 8
max-unit-lines = 200
fail-under = { readability = 60.0, complexity = 60.0 }

# The floor is a safety net rather than the target: component functions
# binding a dozen event handlers are inherently branch-heavy the way a
# hand-written lexer is, and a floor of 85 fails on files that are fine but
# not exceptional. A floor of 70 catches the case that actually matters — a
# file that has become genuinely unpleasant to read. The project score itself
# is what the bar holds high.
[[section]]
path = "crates"
fail-under = { readability = 70.0, complexity = 70.0 }
