name: release-pr

# Creates or refreshes the monochange release pull request on every push to
# main. When a merged commit IS a release record, the publish workflow is
# dispatched instead: that merge is the publish trigger.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'ifiokjr'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      # Push release tags, and upload the release files as git blobs and a
      # tree. The monochange GitHub App writes the release commit and pull
      # request on monochange.dev, and this run proves its repository with an
      # OIDC token.
      contents: write
      # Close a stale release pull request when no changesets are pending.
      pull-requests: write
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pin the exact release: hosted release commits need 0.20.0 or newer,
      # and the release tarball carries the binary at its root (no directory
      # layer).
      - name: install monochange
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/monochange/monochange/releases/download/v0.20.0/monochange-x86_64-unknown-linux-musl-v0.20.0.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/monochange
          monochange --version

      - name: configure release git credentials
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: refresh tags from origin
        run: git fetch --force --tags origin

      - name: detect current release commit
        id: release_record
        run: |
          set -euo pipefail
          release_record_error="$(mktemp)"
          if is_release_commit="$(monochange step release-record --from HEAD --format json --jq '.resolved_commit == .record_commit' 2>"$release_record_error")"; then
            echo "is_release_commit=${is_release_commit}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%B)"
          if [[ "$subject" == chore\(release\):\ prepare\ release* ]] || grep -q '<!-- monochange:release-record:start -->' <<<"$body"; then
            echo "::error::Release-looking commit could not be read as a release record; failing instead of silently skipping release automation."
            cat "$release_record_error" >&2
            exit 1
          fi
          echo "is_release_commit=false" >> "$GITHUB_OUTPUT"

      # A HEAD that is a release record means the release PR merged: tag the
      # record (publish.yml resolves and checks out this tag), then dispatch
      # the publish workflow against the merged tree.
      - name: tag and dispatch publish
        if: steps.release_record.outputs.is_release_commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          monochange step tag-release --from HEAD --push
          tag="$(monochange step release-record --from HEAD --format json \
            | jq -r '[.record.release_targets[] | select(.tag == true)] | first | .tag_name // empty')"
          if [ -z "$tag" ]; then
            echo "::error::Could not determine the release tag from the merged release record." >&2
            exit 1
          fi
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$tag"

      - name: skip refresh on merged release commit
        if: steps.release_record.outputs.is_release_commit == 'true'
        run: echo "HEAD is a merged release commit; publish dispatched."

      - name: detect pending changesets
        id: prepare
        if: steps.release_record.outputs.is_release_commit != 'true'
        run: |
          set -euo pipefail
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets; nothing to release."
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: open or refresh release pull request
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.prepare.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # monochange.dev's GitHub App creates a verified release commit on
          # `monochange/release/release` and opens the release pull request as
          # the monochange bot, so the pull request's own workflows run, which
          # a push made with the job token never triggers.
          MONOCHANGE_RELEASE_BACKEND: hosted
        run: monochange run release

      # No pending changes: retire a stale release branch and PR instead of
      # leaving outdated content open.
      - name: close stale release pull request
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.prepare.outputs.has_changesets != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="monochange/release/release"
          pr_number="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --delete-branch
          fi
