name: website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # devenv provides trunk, wasm-bindgen, tailwindcss, and wasm-opt for the
      # live component previews, at the versions CI builds with.
      - name: setup development environment
        uses: ./.github/actions/devenv # zizmor: ignore[self-repository] the pinned actionlint cannot parse the $/ form yet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The static site, then the component previews into _site/preview.
      - name: build site
        run: site:build _site
        shell: devenv shell -- bash -e {0}

      # The installable items `leptos-aria add` fetches: _site/r/<name>.json.
      - name: build registry
        run: cargo run --locked --manifest-path crates/leptos_aria_cli/Cargo.toml -- build registry/registry.json --output _site/r --strict
        shell: devenv shell -- bash -e {0}

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      # GitHub's Actions artifact service can briefly return 0 artifacts after
      # upload-pages-artifact finalizes (actions/deploy-pages#451,
      # actions/download-artifact#505). Keeping deploy in its own job puts a
      # runner-startup boundary between upload and lookup and prevents failed
      # deploy re-runs from uploading a duplicate github-pages artifact. The
      # two retries below cover longer visibility tails only when deploy-pages
      # fails before creating a deployment (page_url is set as soon as
      # createPagesDeployment returns).
      - name: deploy to github pages
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: wait before retrying deployment
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_1.outputs.page_url == ''
        run: sleep 10

      - name: deploy to github pages (retry 1)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_1.outputs.page_url == ''
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: wait before final deployment retry
        if: steps.deployment_2.outcome == 'failure' && steps.deployment_2.outputs.page_url == ''
        run: sleep 30

      - name: deploy to github pages (retry 2)
        id: deployment_3
        if: steps.deployment_2.outcome == 'failure' && steps.deployment_2.outputs.page_url == ''
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: fail if deployment failed after creation
        if: (steps.deployment_1.outcome == 'failure' && steps.deployment_1.outputs.page_url != '') || (steps.deployment_2.outcome == 'failure' && steps.deployment_2.outputs.page_url != '')
        run: exit 1
