name: website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # devenv provides trunk, wasm-bindgen, tailwindcss, and wasm-opt for the
      # live component previews, at the versions CI builds with.
      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The static site, then the component previews into _site/preview.
      - name: build site
        run: site:build _site
        shell: devenv shell -- bash -e {0}

      # The installable items `leptos-aria add` fetches: _site/r/<name>.json.
      - name: build registry
        run: cargo run --locked --manifest-path crates/leptos_aria_cli/Cargo.toml -- build registry/registry.json --output _site/r --strict
        shell: devenv shell -- bash -e {0}

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: _site

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
