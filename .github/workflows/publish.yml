name: publish

# Runs when a monochange release commit lands on main (dispatched by
# release-pr.yml) or manually for retries. Authenticates to crates.io with
# trusted publishing (GitHub Actions OIDC) — no registry token secret.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0)."
        required: true
        type: string
      dry_run:
        description: "Simulate the publish: build everything and publish nothing."
        required: false
        type: boolean
        default: false

# Every job runs read-only except the publisher, which carries the write
# grants it needs at job level.
permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-revision:
    name: resolve the release revision
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: resolve the tag commit
        id: resolve
        run: |
          set -euo pipefail
          # The publish job checks out this exact sha; resolving from a
          # moving ref (main) is fine because the tag pins the revision.
          sha="$(git rev-list -n1 "$RELEASE_TAG")"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve $RELEASE_TAG to a commit." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

  publish:
    name: publish packages and release
    needs: resolve-revision
    # The publisher environment gates every registry publish behind a
    # required reviewer; this job holds `id-token: write` and exchanges it
    # for crates.io trusted publishing. Keep the environment protection rule
    # configured in repository settings.
    environment: publisher
    permissions:
      contents: write # `gh release create` publishes the GitHub release
      id-token: write # crates.io trusted publishing exchanges the OIDC token
    if: >-
      needs.resolve-revision.result == 'success' &&
      github.repository_owner == 'ifiokjr' &&
      startsWith(inputs.tag, 'v') &&
      (inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          # Full history so monochange can verify the release record's
          # commit is reachable from the release branch.
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/monochange/monochange/releases/download/v0.20.1/monochange-x86_64-unknown-linux-musl-v0.20.1.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/monochange
          monochange --version

      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc

      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: publish release packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          # The repo pins a nightly toolchain file; publishing must run on
          # stable, and RUSTUP_TOOLCHAIN outranks toolchain files.
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          monochange publish packages --all --stream-output

      - name: publish the github release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes "Published by the monochange release flow." ||
            gh release edit "$RELEASE_TAG" --draft=false

  dry-run:
    name: simulate the publish
    needs: resolve-revision
    if: >-
      needs.resolve-revision.result == 'success' &&
      github.repository_owner == 'ifiokjr' &&
      inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
          # Full history so monochange can verify the release record's
          # commit is reachable from the release branch.
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/monochange/monochange/releases/download/v0.20.1/monochange-x86_64-unknown-linux-musl-v0.20.1.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/monochange
          monochange --version

      - name: simulate the publish
        run: |
          set -euo pipefail
          monochange publish packages --all --stream-output --dry-run
