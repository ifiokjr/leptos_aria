name: ci

on:
  push:
    branches:
      - main

  # Unfiltered so stacked pull requests targeting each other also run the
  # checks before they are retargeted at main.
  pull_request:

  merge_group:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ifiokjr/monostyle@c320d9c0bd2d85e8c939e8ac74c2b4e40ea2da5f # v0.3.26
        if: always()
        with:
          path: crates

      - name: setup development environment
        uses: ./.github/actions/devenv # zizmor: ignore[self-repository] the pinned actionlint cannot parse the $/ form yet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: rustfmt
        run: cargo fmt --all -- --check
        shell: devenv shell -- bash -e {0}

      - name: dprint
        run: dprint check
        shell: devenv shell -- bash -e {0}

      - name: actionlint
        run: actionlint .github/workflows/*.yml
        shell: devenv shell -- bash -e {0}

      - name: zizmor
        run: zizmor .github/
        shell: devenv shell -- bash -e {0}

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        shell: devenv shell -- bash -e {0}

      - name: clippy (cli)
        run: cargo clippy --manifest-path crates/leptos_aria_cli/Cargo.toml --all-targets --locked -- -D warnings
        shell: devenv shell -- bash -e {0}

      # The facade's `nightly` feature turns on `leptos/nightly` across the
      # whole workspace build, so this one run lints every crate with the
      # nightly-only code paths enabled.
      - name: clippy (nightly feature)
        run: cargo clippy --all-targets --locked --features leptos_aria/nightly -- -D warnings
        shell: devenv shell -- bash -e {0}

  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv # zizmor: ignore[self-repository] the pinned actionlint cannot parse the $/ form yet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: build:all
        shell: devenv shell -- bash -e {0}

      # The static site plus the trunk-built live component previews.
      - name: build website
        run: site:build
        shell: devenv shell -- bash -e {0}

      - name: build registry
        run: cargo run --locked --manifest-path crates/leptos_aria_cli/Cargo.toml -- build registry/registry.json --output target/site/r --strict
        shell: devenv shell -- bash -e {0}

      - name: upload browser test site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-site
          path: target/site
          retention-days: 1
          if-no-files-found: error

  browser:
    name: browser (${{ matrix.project }})
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, dark, mobile]
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: download browser test site
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: browser-test-site
          path: target/site

      - name: install browser tests
        run: npm ci --ignore-scripts
        working-directory: e2e

      - name: check test types
        run: npm run check
        working-directory: e2e

      - name: test accessibility and keyboard interaction
        run: npm test -- --project="$PROJECT"
        working-directory: e2e
        env:
          PROJECT: ${{ matrix.project }}

      - name: retain browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv # zizmor: ignore[self-repository] the pinned actionlint cannot parse the $/ form yet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: rust tests (native)
        run: cargo test --locked
        shell: devenv shell -- bash -e {0}

      - name: cli tests
        run: cargo test --manifest-path crates/leptos_aria_cli/Cargo.toml --locked
        shell: devenv shell -- bash -e {0}

      # The ubuntu runner image ships a ChromeDriver matched to its Chrome,
      # exposed through `CHROMEWEBDRIVER`; the nix-provided chromedriver is the
      # fallback for environments without it.
      - name: rust tests (wasm)
        run: |
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          cargo test --target wasm32-unknown-unknown --locked
        shell: devenv shell -- bash -e {0}
