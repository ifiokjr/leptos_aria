[package]
name = "leptos_aria_utils"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_utils"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Focus, platform, link, and id utilities shared by leptos_aria"

[dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
slotmap = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "DomRect", "Document", "Element", "Event", "EventTarget", "FocusOptions", "HtmlElement", "Navigator", "Node", "SvgElement", "TransitionEvent", "Window"] }

[features]
# Forwards to `leptos`'s `nightly` feature for nightly-only signal and renderer
# optimizations; a no-op on stable toolchains.
nightly = ["leptos/nightly"]

[lints]
workspace = true
