[package]
name = "leptos_aria_utils"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_utils"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared utilities for the leptos_aria component library"

[dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
slotmap = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "FocusOptions", "HtmlElement", "Navigator", "Node", "SvgElement", "TransitionEvent", "Window"] }

[lints]
workspace = true
