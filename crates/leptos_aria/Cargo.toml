[package]
name = "leptos_aria"
version = "0.1.2"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless, accessible Leptos components ported from React Aria"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_aria_accordion = { workspace = true }
leptos_aria_breadcrumbs = { workspace = true }
leptos_aria_button = { workspace = true }
leptos_aria_checkbox = { workspace = true }
leptos_aria_color = { workspace = true }
leptos_aria_combo_box = { workspace = true }
leptos_aria_date = { workspace = true }
leptos_aria_date_picker = { workspace = true }
leptos_aria_disclosure = { workspace = true }
leptos_aria_drop_zone = { workspace = true }
leptos_aria_file_trigger = { workspace = true }
leptos_aria_form = { workspace = true }
leptos_aria_grid = { workspace = true }
leptos_aria_interactions = { workspace = true }
leptos_aria_link = { workspace = true }
leptos_aria_list_box = { workspace = true }
leptos_aria_menu = { workspace = true }
leptos_aria_number_field = { workspace = true }
leptos_aria_overlay = { workspace = true }
leptos_aria_pagination = { workspace = true }
leptos_aria_primitives = { workspace = true }
leptos_aria_progress = { workspace = true }
leptos_aria_radio = { workspace = true }
leptos_aria_search_field = { workspace = true }
leptos_aria_select_box = { workspace = true }
leptos_aria_selection = { workspace = true }
leptos_aria_slider = { workspace = true }
leptos_aria_table = { workspace = true }
leptos_aria_tabs = { workspace = true }
leptos_aria_tag = { workspace = true }
leptos_aria_text_field = { workspace = true }
leptos_aria_time_field = { workspace = true }
leptos_aria_toast = { workspace = true }
leptos_aria_toggle = { workspace = true }
leptos_aria_toolbar = { workspace = true }
leptos_aria_tree = { workspace = true }
leptos_aria_utils = { workspace = true }

[features]
# Forwards to `leptos`'s `nightly` feature across every member crate for
# nightly-only signal and renderer optimizations; a no-op on stable toolchains.
nightly = [
	"leptos/nightly",
	"leptos_aria_accordion/nightly",
	"leptos_aria_breadcrumbs/nightly",
	"leptos_aria_button/nightly",
	"leptos_aria_checkbox/nightly",
	"leptos_aria_color/nightly",
	"leptos_aria_combo_box/nightly",
	"leptos_aria_date_picker/nightly",
	"leptos_aria_disclosure/nightly",
	"leptos_aria_drop_zone/nightly",
	"leptos_aria_file_trigger/nightly",
	"leptos_aria_form/nightly",
	"leptos_aria_grid/nightly",
	"leptos_aria_interactions/nightly",
	"leptos_aria_link/nightly",
	"leptos_aria_list_box/nightly",
	"leptos_aria_menu/nightly",
	"leptos_aria_number_field/nightly",
	"leptos_aria_overlay/nightly",
	"leptos_aria_pagination/nightly",
	"leptos_aria_primitives/nightly",
	"leptos_aria_progress/nightly",
	"leptos_aria_radio/nightly",
	"leptos_aria_search_field/nightly",
	"leptos_aria_select_box/nightly",
	"leptos_aria_selection/nightly",
	"leptos_aria_slider/nightly",
	"leptos_aria_table/nightly",
	"leptos_aria_tabs/nightly",
	"leptos_aria_tag/nightly",
	"leptos_aria_text_field/nightly",
	"leptos_aria_time_field/nightly",
	"leptos_aria_toast/nightly",
	"leptos_aria_toggle/nightly",
	"leptos_aria_toolbar/nightly",
	"leptos_aria_tree/nightly",
	"leptos_aria_utils/nightly",
]

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
