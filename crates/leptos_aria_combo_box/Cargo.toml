[package]
name = "leptos_aria_combo_box"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_combo_box"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Accessible filtering combo box for Leptos"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_aria_list_box = { workspace = true }
leptos_aria_selection = { workspace = true }
leptos_aria_utils = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlInputElement"] }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
