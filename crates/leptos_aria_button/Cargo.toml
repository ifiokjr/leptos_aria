[package]
name = "leptos_aria_button"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_button"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Accessible native, anchor, and custom-element buttons for Leptos"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_aria_interactions = { workspace = true }
leptos_aria_utils = { workspace = true }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["HtmlButtonElement"] }

[lints]
workspace = true
