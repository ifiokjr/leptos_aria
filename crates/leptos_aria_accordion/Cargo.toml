[package]
name = "leptos_aria_accordion"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_accordion"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Accessible accordion with single and multiple expansion for Leptos"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_aria_utils = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlButtonElement"] }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }

[features]
# Forwards to `leptos`'s `nightly` feature for nightly-only signal and renderer
# optimizations; a no-op on stable toolchains.
nightly = ["leptos/nightly"]

[lints]
workspace = true
