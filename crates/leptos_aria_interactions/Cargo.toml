[package]
name = "leptos_aria_interactions"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_interactions"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Interaction hooks for the leptos_aria component library"

[dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
leptos_aria_utils = { workspace = true }
typed-builder = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "DomRect", "DragEvent", "Element", "Event", "EventTarget", "HtmlAnchorElement", "HtmlButtonElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent", "Node", "PointerEvent", "SvgElement", "Touch", "TouchEvent", "TouchList", "WheelEvent", "Window"] }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
