[package]
name = "leptos_aria_interactions"
version = "0.1.1"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_interactions"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Press, hover, focus, keyboard, move, drag, and scroll interaction hooks for Leptos"

[dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
leptos-use = { workspace = true }
leptos_aria_utils = { workspace = true }
typed-builder = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "DomRect", "DragEvent", "Element", "Event", "EventTarget", "HtmlAnchorElement", "HtmlButtonElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent", "Node", "PointerEvent", "SvgElement", "Touch", "TouchEvent", "TouchList", "WheelEvent", "Window"] }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
wasm-bindgen-test = { workspace = true }

[features]
# Forwards to `leptos`'s `nightly` feature for nightly-only signal and renderer
# optimizations; a no-op on stable toolchains.
nightly = ["leptos/nightly"]

[lints]
workspace = true
