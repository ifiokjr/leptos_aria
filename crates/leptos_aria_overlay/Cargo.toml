[package]
name = "leptos_aria_overlay"
version = "0.1.1"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leptos_aria_overlay"
edition.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md"]
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Accessible modal, dialog, alert dialog, popover, tooltip, and hover card for Leptos"

[dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
leptos_aria_utils = { workspace = true }
send_wrapper = { workspace = true }
typed-builder = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "FocusEvent", "HtmlElement", "HtmlInputElement", "NodeList", "Window"] }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["NodeList"] }

[features]
# Forwards to `leptos`'s `nightly` feature for nightly-only signal and renderer
# optimizations; a no-op on stable toolchains.
nightly = ["leptos/nightly"]

[lints]
workspace = true
