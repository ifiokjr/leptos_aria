[package]
name = "leptos_aria_cli"
version = "0.0.0"
edition = "2024"
license = "Unlicense"
readme = "readme.md"
repository = "https://github.com/ifiokjr/leptos_aria"
description = "The leptos_aria component registry CLI"

[[bin]]
name = "leptos-aria"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
