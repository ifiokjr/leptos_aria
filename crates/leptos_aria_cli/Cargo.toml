[package]
name = "leptos_aria_cli"
version = "0.1.1"
categories = ["command-line-utilities", "development-tools", "web-programming"]
edition = "2024"
homepage = "https://ifiokjr.github.io/leptos_aria/"
keywords = ["leptos", "aria", "shadcn", "tailwind", "cli"]
license = "Unlicense"
readme = "readme.md"
repository = "https://github.com/ifiokjr/leptos_aria"
description = "Copy Tailwind-styled leptos_aria components into your Leptos project, shadcn-style"

# `cargo binstall leptos_aria_cli` downloads the archive that the publish
# workflow attaches to each GitHub release (`leptos-aria-<target>-v<version>`,
# with the binary at the archive root) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/leptos-aria-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

# Built on its own: the CLI has no wasm dependencies and keeps its own lockfile.
[workspace]

[[bin]]
name = "leptos-aria"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
toml = "0.9"
ureq = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
