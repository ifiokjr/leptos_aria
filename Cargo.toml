[workspace]
members = ["crates/*"]
exclude = ["crates/leptos_aria_cli"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
categories = ["wasm", "web-programming", "gui", "accessibility"]
edition = "2024"
homepage = "https://ifiokjr.github.io/leptos_aria/"
keywords = ["leptos", "aria", "a11y", "ui"]
license = "Unlicense"
readme = "readme.md"
repository = "https://github.com/ifiokjr/leptos_aria"
rust-version = "1.85.0"

[workspace.dependencies]
console_error_panic_hook = "0.1"
console_log = "0.2"
js-sys = "=0.3.106"
leptos = "0.8.22"
leptos-use = "0.19"
send_wrapper = "0.6"
slotmap = "1"
typed-builder = "0.23"
# Pinned to the `wasm-bindgen-cli` version shipped in the devenv lock's
# nixpkgs, so the `wasm-bindgen-test-runner` from the devenv shell always
# matches the crate. `wasm-bindgen-test` is pinned to the release pairing
# with exactly this `wasm-bindgen` version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "=0.3.79"
web-sys = "=0.3.106"

# internal
leptos_aria_accordion = { path = "crates/leptos_aria_accordion", version = "0.0.1" }
leptos_aria_breadcrumbs = { path = "crates/leptos_aria_breadcrumbs", version = "0.0.1" }
leptos_aria_button = { path = "crates/leptos_aria_button", version = "0.0.1" }
leptos_aria_calendar = { path = "crates/leptos_aria_calendar", version = "0.0.1" }
leptos_aria_checkbox = { path = "crates/leptos_aria_checkbox", version = "0.0.1" }
leptos_aria_color = { path = "crates/leptos_aria_color", version = "0.0.1" }
leptos_aria_combo_box = { path = "crates/leptos_aria_combo_box", version = "0.0.1" }
leptos_aria_date = { path = "crates/leptos_aria_date", version = "0.0.1" }
leptos_aria_date_picker = { path = "crates/leptos_aria_date_picker", version = "0.0.1" }
leptos_aria_disclosure = { path = "crates/leptos_aria_disclosure", version = "0.0.1" }
leptos_aria_drop_zone = { path = "crates/leptos_aria_drop_zone", version = "0.0.1" }
leptos_aria_file_trigger = { path = "crates/leptos_aria_file_trigger", version = "0.0.1" }
leptos_aria_form = { path = "crates/leptos_aria_form", version = "0.0.1" }
leptos_aria_grid = { path = "crates/leptos_aria_grid", version = "0.0.1" }
leptos_aria_interactions = { path = "crates/leptos_aria_interactions", version = "0.0.1" }
leptos_aria_link = { path = "crates/leptos_aria_link", version = "0.0.1" }
leptos_aria_list_box = { path = "crates/leptos_aria_list_box", version = "0.0.1" }
leptos_aria_menu = { path = "crates/leptos_aria_menu", version = "0.0.1" }
leptos_aria_number_field = { path = "crates/leptos_aria_number_field", version = "0.0.1" }
leptos_aria_overlay = { path = "crates/leptos_aria_overlay", version = "0.0.1" }
leptos_aria_pagination = { path = "crates/leptos_aria_pagination", version = "0.0.1" }
leptos_aria_primitives = { path = "crates/leptos_aria_primitives", version = "0.0.1" }
leptos_aria_progress = { path = "crates/leptos_aria_progress", version = "0.0.1" }
leptos_aria_radio = { path = "crates/leptos_aria_radio", version = "0.0.1" }
leptos_aria_search_field = { path = "crates/leptos_aria_search_field", version = "0.0.1" }
leptos_aria_select_box = { path = "crates/leptos_aria_select_box", version = "0.0.1" }
leptos_aria_selection = { path = "crates/leptos_aria_selection", version = "0.0.1" }
leptos_aria_slider = { path = "crates/leptos_aria_slider", version = "0.0.1" }
leptos_aria_table = { path = "crates/leptos_aria_table", version = "0.0.1" }
