[package]
name = "leptos_aria_registry"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Source of the leptos_aria component registry, compiled so every copied component builds"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_aria = { path = "../crates/leptos_aria" }
tw_merge = { workspace = true }

[dev-dependencies]
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Window"] }

[lints]
workspace = true
